    <rect x="75" y="90" width="130" height="34" rx="5"/>
    <rect x="18" y="188" width="82" height="30" rx="5"/><rect x="159" y="188" width="94" height="30" rx="5"/>
    <path d="M59 188V155H140V124M206 188V155H140" marker-end="url(#arrow)"/>
    <rect x="14" y="287" width="86" height="30" rx="15"/>
