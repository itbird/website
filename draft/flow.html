  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,

  ) {

  }

  .form-check-label {

  }

  .form-range {

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {

  }

  .form-range::-webkit-slider-thumb {

  &lt;style&gt;
    #perishnet-rq-flow {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      --background: #f8fafc;
      --foreground: #172033;
      --card: #ffffff;
      --card-foreground: #172033;
      --popover: #ffffff;
      --popover-foreground: #172033;
      --primary: #1d4ed8;
      --primary-foreground: #ffffff;
      --muted: #e9eef5;
      --muted-foreground: #64748b;
      --border: #cbd5e1;
      --input: #cbd5e1;
      --blue: #2563eb;
      --orange: #ea580c;
      --green: #16a34a;
      --purple: #7c3aed;
      --viz-series-1: #0f766e;
      --viz-series-2: #16a34a;
      --viz-series-3: #7c3aed;
      --viz-series-4: #ea580c;
      --viz-series-5: #2563eb;
      --viz-series-6: #059669;
      background: var(--background);
      color: var(--foreground);
      display: grid;
      gap: 6px;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      height: 100vh;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    #perishnet-rq-flow h2 {
      margin: 0;
    }

    #perishnet-rq-flow .title-row {
      align-items: baseline;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
    }

    #perishnet-rq-flow .research-aim { margin: 6px 0 0; font-size: 14px; font-weight: 700; }
    #perishnet-rq-flow .research-aim-detail { margin: 3px 0 0; font-size: 12px; color: var(--muted-foreground); }

    #perishnet-rq-flow .version-meta {
      color: var(--muted-foreground);
      flex: 0 0 auto;
      text-align: right;
    }

    #perishnet-rq-flow .btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--foreground);
      cursor: pointer;
      font: inherit;
      padding: 4px 10px;
    }

    #perishnet-rq-flow .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-foreground);
    }

    #perishnet-rq-flow .form-select,
    #perishnet-rq-flow .form-range {
      font: inherit;
    }

    #perishnet-rq-flow .form-select {
      appearance: auto;
      -webkit-appearance: menulist;
      width: auto;
      flex: 0 0 auto;
      background: var(--card);
      border: 1px solid var(--input);
      border-radius: 6px;
      color: var(--foreground);
      padding: 4px 8px;
    }

    #perishnet-rq-flow .text-small {
      font-size: 12px;
    }

    #perishnet-rq-flow .text-muted {
      color: var(--muted-foreground);
    }

    #perishnet-rq-flow .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--card-foreground);
    }

    #perishnet-rq-flow .viz-controls {
      align-items: center;
      gap: 10px;
      justify-content: flex-start;
    }

    #perishnet-rq-flow .control-group,
    #perishnet-rq-flow .field {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    #perishnet-rq-flow .field input {
      min-width: 120px;
    }

    #perishnet-rq-flow .field {
      flex-direction: row;
      flex-wrap: nowrap;
      white-space: nowrap;
      margin: 0;
      width: auto;
    }

    #perishnet-rq-flow .diagram {
      min-height: 0;
      width: 100%;
    }

    #perishnet-rq-flow svg {
      display: block;
      height: 100%;
      overflow: visible;
      width: 100%;
    }

    #perishnet-rq-flow .band {
      fill: color-mix(in srgb, var(--muted) 20%, transparent);
    }

    #perishnet-rq-flow .rq-track {
      fill: none;
      stroke: color-mix(in srgb, var(--border) 70%, var(--foreground));
      stroke-width: 1.2;
    }

    #perishnet-rq-flow .band-label,
    #perishnet-rq-flow .edge-label {
      fill: var(--muted-foreground);
      font-size: 11px;
      font-weight: 400;
    }

    #perishnet-rq-flow .edge-label[data-flow-text],
    #perishnet-rq-flow .node .sub[data-flow-text] {
      fill: var(--foreground);
      font-weight: 500;
    }

    #perishnet-rq-flow .question-panel rect {
      fill: color-mix(in srgb, var(--card) 94%, transparent);
      stroke: var(--viz-series-1);
      stroke-width: 2;

    #perishnet-rq-flow .question-heading {

      font-size: 11px;
      font-weight: 700;
    }

    #perishnet-rq-flow .question-text {
      fill: var(--muted-foreground);
      font-size: 9.5px;
      font-weight: 400;
    }

    #perishnet-rq-flow .node rect {
      fill: color-mix(in srgb, var(--card) 90%, transparent);
      stroke: var(--border);
      stroke-width: 1.2;
    }

    #perishnet-rq-flow .node .title {
      cursor: help;
      font-weight: 700;
    }

    #perishnet-rq-flow .node, #perishnet-rq-flow .question-panel { cursor: zoom-in; }
    #perishnet-rq-flow .node:focus-visible, #perishnet-rq-flow .question-panel:focus-visible { outline: 2px solid var(--blue); }
    #perishnet-rq-flow .focus-dialog.questions-focus { width: min(760px, calc(100vw - 32px)); }
    #perishnet-rq-flow .questions-focus .focus-lines { list-style: none; padding-left: 0; }
    #perishnet-rq-flow .questions-focus .focus-lines li { margin-bottom: 20px; }
    #perishnet-rq-flow .questions-focus .focus-lines strong { display: block; }
    #perishnet-rq-flow .focus-dialog {
      box-sizing: border-box;
      width: min(600px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      padding: 28px;
      border: 3px solid var(--focus-color, var(--border));
      border-radius: 8px;
      background: var(--card);
      color: var(--foreground);

    #perishnet-rq-flow .focus-dialog::backdrop { background: rgb(0 0 0 / 35%); }
    #perishnet-rq-flow .focus-header { display: flex; align-items: flex-start; gap: 16px; }

      font-weight: 400;
    }

      stroke: var(--muted-foreground);
      stroke-width: 2.2;

      stroke: var(--viz-series-1);
      stroke-width: 3;
    }

    #perishnet-rq-flow .ontology rect {
      fill: color-mix(in srgb, var(--purple) 13%, var(--card));
      stroke: var(--purple);
      stroke-width: 2.6;
    }

    #perishnet-rq-flow .handoff polygon {
      fill: color-mix(in srgb, var(--orange) 11%, var(--card));
      stroke: var(--orange);
      stroke-width: 2.2;
    }

      stroke-width: 2.6;

    #perishnet-rq-flow .edge.claim-edge {

    #perishnet-rq-flow .packet-main {
      fill: var(--viz-series-1);
    }

    #perishnet-rq-flow .packet-method {

    #perishnet-rq-flow .packet-feedback {

    #perishnet-rq-flow .packet-glow {

      gap: 5px;
      padding-block: 8px;
    }

    #perishnet-rq-flow .status-main {

    }

    #perishnet-rq-flow .status-sub {
      color: var(--muted-foreground);
      font-weight: 500;
    }

      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    #perishnet-rq-flow .legend-item {

      display: inline-flex;
      gap: 6px;

    #perishnet-rq-flow .swatch {

    #perishnet-rq-flow .swatch.ontology { background: var(--purple); }

      #perishnet-rq-flow .control-group,
      #perishnet-rq-flow .field {
        align-items: stretch;
        flex-direction: column;
      }

      &lt;g class=&quot;node gap&quot; transform=&quot;translate(30 126)&quot; data-tip-title=&quot;Targeted research gaps&quot; data-tip-body=&quot;RQ1 targets fragmented food-degradation knowledge; RQ2 targets weak links between cold-chain events and food-state assessments; RQ3 targets limited reasoning from risk states to intervention actions. The focus is a coherent, traceable semantic connection between food batches, event evidence, degradation assessments and intervention recommendations. These targeted gaps require further specification and support through the literature review; they are not claims that all existing approaches lack these capabilities.&quot;&gt;
        &lt;rect width=&quot;194&quot; height=&quot;138&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
        &lt;text class=&quot;title&quot; x=&quot;97&quot; y=&quot;25&quot; text-anchor=&quot;middle&quot;&gt;Targeted research gaps&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;97&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot;&gt;&lt;tspan x=&quot;97&quot;&gt;Fragmented food-degradation&lt;/tspan&gt;&lt;tspan x=&quot;97&quot; dy=&quot;13&quot;&gt;knowledge&lt;/tspan&gt;&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;97&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot;&gt;&lt;tspan x=&quot;97&quot;&gt;Weak cold-chain event&lt;/tspan&gt;&lt;tspan x=&quot;97&quot; dy=&quot;13&quot;&gt;to assessment linkage&lt;/tspan&gt;&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;97&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;&lt;tspan x=&quot;97&quot;&gt;Limited waste-risk&lt;/tspan&gt;&lt;tspan x=&quot;97&quot; dy=&quot;13&quot;&gt;to intervention reasoning&lt;/tspan&gt;&lt;/text&gt;
      &lt;/g&gt;

      &lt;g class=&quot;node gap&quot; transform=&quot;translate(42 280)&quot; data-tip-title=&quot;Case evidence&quot; data-tip-body=&quot;Each case specifies food identity (product type, form and packaging), initial condition at the assessment start, available quality observations, and batch and delivery context. Temperature, delay or inspection evidence changes with the selected scenario. Unknown initial conditions remain explicit assumptions, not presumed freshness. Specific foods, indicators and endpoints will be defined in the case study.&quot;&gt;
        &lt;rect width=&quot;146&quot; height=&quot;96&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
        &lt;text class=&quot;title&quot; x=&quot;73&quot; y=&quot;25&quot; text-anchor=&quot;middle&quot;&gt;Case evidence&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;73&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; data-flow-text=&quot;sourceLine1&quot;&gt;Batch temperature history&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;73&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; data-flow-text=&quot;sourceLine2&quot;&gt;cold-chain events&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;73&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;Food identity + initial condition&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;73&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot;&gt;Batch + delivery context&lt;/text&gt;
      &lt;/g&gt;

      &lt;g class=&quot;node rq&quot; transform=&quot;translate(282 126)&quot; data-tip-title=&quot;RQ1&quot; data-tip-body=&quot;How can heterogeneous food degradation knowledge be represented as a unified ontology for condition-dependent, evidence-supported perishability assessment?&quot;&gt;
        &lt;rect width=&quot;166&quot; height=&quot;124&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
        &lt;text class=&quot;title&quot; x=&quot;83&quot; y=&quot;25&quot; text-anchor=&quot;middle&quot;&gt;RQ1&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;Condition-dependent degradation&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;Food quality indicators&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;Links to remaining shelf life&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot;&gt;Model applicability conditions&lt;/text&gt;
      &lt;/g&gt;

      &lt;g class=&quot;node ontology&quot; transform=&quot;translate(282 286)&quot; data-tip-title=&quot;GOPFD&quot; data-tip-full=&quot;Generic Ontology for Perishable Food Degradation&quot; data-tip-body=&quot;GOPFD represents food-specific degradation mechanisms, quality indicators, assessment endpoints, and shelf-life models with their applicability conditions and evidence. Endpoints must identify what is being judged, such as quality acceptability; a quality endpoint is not automatically a safety endpoint. The ontology represents these relationships rather than executing predictions. Food-specific indicators and criteria remain to be established for the case study.&quot;&gt;
        &lt;rect width=&quot;166&quot; height=&quot;88&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
        &lt;text class=&quot;title&quot; x=&quot;83&quot; y=&quot;21&quot; text-anchor=&quot;middle&quot;&gt;GOPFD&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot;&gt;Food degradation mechanisms&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot;&gt;&lt;tspan x=&quot;83&quot;&gt;Quality indicators +&lt;/tspan&gt;&lt;tspan x=&quot;83&quot; dy=&quot;11&quot;&gt;assessment endpoints&lt;/tspan&gt;&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot;&gt;Model conditions + evidence&lt;/text&gt;
      &lt;/g&gt;

      &lt;g class=&quot;node handoff&quot; transform=&quot;translate(582 386)&quot; data-tip-title=&quot;WasteRiskCondition&quot; data-tip-body=&quot;A derived, context-dependent risk of food becoming unused, informed by degradation assessment and logistics conditions, including remaining shelf life, expected delivery and use times, and the time needed for feasible interventions. The research aims to identify risk while opportunities to act remain; this is not a validated early-warning claim. Quality loss, unsafe food and food waste are distinct concepts. This is a semantic handoff state, not a fourth ontology; its derivation and relation to intervention windows require validation.&quot;&gt;
        &lt;polygon points=&quot;8,0 150,0 158,8 158,30 150,38 8,38 0,30 0,8&quot;&gt;&lt;/polygon&gt;
        &lt;text class=&quot;title&quot; x=&quot;79&quot; y=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;WasteRiskCondition&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;79&quot; y=&quot;24&quot; text-anchor=&quot;middle&quot;&gt;Risk of food becoming unused&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;79&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot;&gt;Remaining intervention window&lt;/text&gt;
      &lt;/g&gt;

      &lt;g class=&quot;node method&quot; transform=&quot;translate(282 438)&quot; data-tip-title=&quot;External models + CQ validation&quot; data-tip-body=&quot;External degradation and shelf-life models perform calculations. Each model requires a documented source, applicable food and storage conditions, parameters, initial-state assumptions and assessment endpoint. Quality endpoints must not be treated as safety certification. Planned validation compares predictions with independent food observations where suitable data are available; CQ, SPARQL and consistency checks validate the semantic layer, not food-prediction accuracy.&quot;&gt;
        &lt;rect width=&quot;166&quot; height=&quot;96&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
        &lt;text class=&quot;title&quot; x=&quot;83&quot; y=&quot;25&quot; text-anchor=&quot;middle&quot;&gt;External models + CQ&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot;&gt;Condition-based shelf-life estimates&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;67&quot; text-anchor=&quot;middle&quot;&gt;Query event-to-assessment links&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;Consistency + food-related CQs&lt;/text&gt;
      &lt;/g&gt;

      &lt;g class=&quot;node rq&quot; transform=&quot;translate(542 126)&quot; data-tip-title=&quot;RQ2&quot; data-tip-body=&quot;How can an event-driven temporal knowledge graph integrate cold-chain events, IoT observations, temporal supply-chain contexts and GOPFD-based assessments for traceable and reproducible updates?&quot;&gt;
        &lt;rect width=&quot;166&quot; height=&quot;124&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
        &lt;text class=&quot;title&quot; x=&quot;83&quot; y=&quot;25&quot; text-anchor=&quot;middle&quot;&gt;RQ2&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;Link events to food batches&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;Batch temperature history&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;Update assessments with evidence&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot;&gt;Reconstruct historical batch risk&lt;/text&gt;
      &lt;/g&gt;

      &lt;g class=&quot;node ontology&quot; transform=&quot;translate(542 272)&quot; data-tip-title=&quot;CCIEO + event-driven TKG&quot; data-tip-full=&quot;Cold-Chain IoT and Event-driven Ontology&quot; data-tip-body=&quot;CCIEO represents processes, batches, events and observations with provenance. The temporal graph distinguishes observation time, valid time, transaction time and inference time before linking evidence to GOPFD assessments.&quot;&gt;
        &lt;rect width=&quot;166&quot; height=&quot;110&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
        &lt;text class=&quot;title&quot; x=&quot;83&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot;&gt;CCIEO + TKG&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; data-flow-text=&quot;ccieoLine1&quot;&gt;event evidence&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; data-flow-text=&quot;ccieoLine2&quot;&gt;observation / valid time&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot;&gt;Evidence times + provenance&lt;/text&gt;
      &lt;/g&gt;

      &lt;g class=&quot;node method&quot; transform=&quot;translate(542 438)&quot; data-tip-title=&quot;AI methods for RQ2&quot; data-tip-body=&quot;Proposed methods detect relevant temperature-exposure or delay events, derive features for food-batch assessment, and estimate uncertainty from incomplete evidence. The specific algorithms and uncertainty method remain to be selected and evaluated; these labels do not imply an implemented or validated AI backend.&quot;&gt;
        &lt;rect width=&quot;166&quot; height=&quot;96&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
        &lt;text class=&quot;title&quot; x=&quot;83&quot; y=&quot;25&quot; text-anchor=&quot;middle&quot;&gt;AI method layer&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot; data-flow-text=&quot;aiLine1&quot;&gt;event detection&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;67&quot; text-anchor=&quot;middle&quot;&gt;Features for batch assessment&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;83&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;Incomplete-evidence uncertainty&lt;/text&gt;
      &lt;/g&gt;

      &lt;g class=&quot;node rq&quot; transform=&quot;translate(812 126)&quot; data-tip-title=&quot;RQ3&quot; data-tip-body=&quot;How can an ontology-based, constraint-aware decision-support model formally represent and reason over evolving degradation-risk states, logistics contexts and intervention options to generate explainable waste-aware recommendations?&quot;&gt;
        &lt;rect width=&quot;162&quot; height=&quot;124&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
        &lt;text class=&quot;title&quot; x=&quot;81&quot; y=&quot;25&quot; text-anchor=&quot;middle&quot;&gt;RQ3&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;81&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;Feasible waste-reduction actions&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;81&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;Remaining shelf life&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;81&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;Delivery + storage constraints&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;81&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot;&gt;Explain intervention trade-offs&lt;/text&gt;
      &lt;/g&gt;

      &lt;g class=&quot;node ontology&quot; transform=&quot;translate(812 272)&quot; data-tip-title=&quot;WALDRO&quot; data-tip-full=&quot;Waste-Aware Logistics and Dynamic Rerouting Ontology&quot; data-tip-body=&quot;WALDRO represents logistics contexts, safety and time constraints, intervention options and their eligibility conditions. It supports reasoning about which waste-reduction actions remain feasible before their intervention windows close, considering delivery, storage, remaining shelf life and action lead times. The aim is timely, explainable decision support, not guaranteed waste reduction or permission to relax safety constraints.&quot;&gt;
        &lt;rect width=&quot;162&quot; height=&quot;110&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
        &lt;text class=&quot;title&quot; x=&quot;81&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot;&gt;WALDRO&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;81&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;Intervention windows + deadlines&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;81&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot;&gt;Waste-reduction interventions&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;81&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot;&gt;Actions feasible before time runs out&lt;/text&gt;
      &lt;/g&gt;

      &lt;g class=&quot;node method&quot; transform=&quot;translate(812 438)&quot; data-tip-title=&quot;AI methods for RQ3&quot; data-tip-body=&quot;AI-supported reasoning ranks candidate actions by risk, feasibility, time sensitivity, safety boundaries, and waste-reduction potential.&quot;&gt;
        &lt;rect width=&quot;162&quot; height=&quot;96&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
        &lt;text class=&quot;title&quot; x=&quot;81&quot; y=&quot;25&quot; text-anchor=&quot;middle&quot;&gt;AI ranking&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;81&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot; data-flow-text=&quot;aiLine2&quot;&gt;risk-aware ranking&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;81&quot; y=&quot;67&quot; text-anchor=&quot;middle&quot;&gt;Exclude infeasible interventions&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;81&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;Explain constraints + ranking&lt;/text&gt;
      &lt;/g&gt;

      &lt;g class=&quot;node evaluation&quot; transform=&quot;translate(1074 126)&quot; data-tip-title=&quot;RQ-aligned evaluation&quot; data-tip-body=&quot;Planned validation, not completed experimental evidence. RQ1 examines food-degradation CQ coverage and consistency; RQ2 checks batch-state correctness, temporal traceability and replay; RQ3 tests intervention feasibility and faithful justification. Food-science validation will compare model predictions with independent quality or endpoint observations, subject to suitable data and model applicability. Simulation alone does not establish food-prediction accuracy or real waste reduction.&quot;&gt;
        &lt;rect width=&quot;170&quot; height=&quot;124&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
        &lt;text class=&quot;title&quot; x=&quot;85&quot; y=&quot;25&quot; text-anchor=&quot;middle&quot;&gt;RQ-aligned evaluation&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;85&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;RQ1: food-degradation CQ coverage&lt;/text&gt;
        &lt;text class=&quot;sub&quot; x=&quot;85&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;RQ2: correct batch-state updates&lt;/text&gt;

      // Follow one connected case narrative, rather than animating research dependencies.
      const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
      const route = [
        [&quot;p4&quot;, &quot;CCIEO + event-driven TKG&quot;],
        [&quot;p5&quot;, &quot;GOPFD&quot;],
        [&quot;p6a&quot;, &quot;WasteRiskCondition&quot;],
        [&quot;p6b&quot;, &quot;WALDRO&quot;],
        [&quot;p7&quot;, &quot;Research contribution&quot;],
        [&quot;p9b&quot;, &quot;Expected research claim&quot;]
      ].map(([id, title]) =&gt; {
        const path = paths.find((item) =&gt; item.dataset.path === id);
        const length = path.getTotalLength();
        const node = root.querySelector(`.node[data-tip-title=&quot;${title}&quot;]`);
        const emphasis = node.querySelector(&quot;.sub&quot;) || node.querySelector(&quot;.title&quot;);
        const outline = node.querySelector(&quot;rect, polygon&quot;);
        emphasis.style.transformBox = &quot;fill-box&quot;;
        emphasis.style.transformOrigin = &quot;center&quot;;
        return { path, length, duration: Math.max(1000, length * 14), emphasis, outline,
          strokeWidth: parseFloat(getComputedStyle(outline).strokeWidth) };
      });
      const dwell = 1800;
      const totalDuration = route.reduce((sum, step) =&gt; sum + step.duration + dwell, 0);
      const traveller = makeSvg(&quot;g&quot;);
      traveller.style.pointerEvents = &quot;none&quot;;
      const halo = makeSvg(&quot;circle&quot;);
      halo.setAttribute(&quot;r&quot;, &quot;11&quot;);
      halo.setAttribute(&quot;class&quot;, &quot;packet-glow packet-main&quot;);
      const arrow = makeSvg(&quot;path&quot;);
      arrow.setAttribute(&quot;d&quot;, &quot;M9 0 L-7 -6 L-3 0 L-7 6 Z&quot;);
      arrow.setAttribute(&quot;class&quot;, &quot;packet-main&quot;);
      traveller.append(halo, arrow);
      packetLayer.append(traveller);

      function drawJourney() {
        let remaining = clock;
        let active = route[route.length - 1];
        for (const step of route) {
          active = step;
          if (remaining &lt;= step.duration + dwell) break;
          remaining -= step.duration + dwell;
        }
        const distance = Math.min(1, remaining / active.duration) * active.length;
        const p = active.path.getPointAtLength(distance);
        const before = active.path.getPointAtLength(Math.max(0, distance - 1));
        const after = active.path.getPointAtLength(Math.min(active.length, distance + 1));
        const angle = Math.atan2(after.y - before.y, after.x - before.x) * 180 / Math.PI;
        traveller.setAttribute(&quot;transform&quot;, `translate(${p.x} ${p.y}) rotate(${angle})`);
        paths.forEach((path) =&gt; { path.style.strokeWidth = path === active.path ? &quot;3.6&quot; : &quot;&quot;; });
        // Drive both breaths from the journey clock so pause and speed stay in sync.
        route.forEach((step) =&gt; {
          step.emphasis.style.transform = &quot;&quot;;
          step.outline.style.strokeWidth = &quot;&quot;;
        });
        if (remaining &gt;= active.duration) {
          const progress = Math.min(1, (remaining - active.duration) / dwell);
          const pulse = reducedMotion.matches ? 0 : Math.sin(progress * Math.PI * 2) ** 2;
          active.emphasis.style.transform = `scale(${1 + 0.06 * pulse})`;
          active.outline.style.strokeWidth = String(active.strokeWidth + (reducedMotion.matches ? 0.8 : 1.4 * pulse));
        }
      }

      function updateScenario() {
        const selected = scenarioText[scenarioInput.value];
        statusMain.textContent = selected.main;
        statusSub.textContent = selected.sub;
        dynamicTextNodes.forEach((node) =&gt; {
          const value = selected[node.dataset.flowText];
          if (value) node.textContent = value;
        });
        clock = 0;
        toggle.textContent = running ? &quot;Pause&quot; : &quot;Run&quot;;
        drawJourney();
      }

      function animate(now) {
        const delta = Math.min(48, now - last);
        last = now;
        if (running) clock = (clock + delta * speed) % totalDuration;
        drawJourney();
        requestAnimationFrame(animate);
      }

      function moveTooltip(event) {
        const bounds = root.getBoundingClientRect();
        const tipWidth = tooltip.offsetWidth || 320;
        const tipHeight = tooltip.offsetHeight || 90;
        const left = Math.min(Math.max(8, event.clientX - bounds.left + 12), Math.max(8, bounds.width - tipWidth - 8));
        const top = Math.min(Math.max(8, event.clientY - bounds.top - 10), Math.max(8, bounds.height - tipHeight - 8));
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
      }

      titleNodes.forEach((titleNode) =&gt; {
        const node = titleNode.closest(&quot;.node&quot;);
        titleNode.addEventListener(&quot;mouseenter&quot;, (event) =&gt; {
          tooltipTitle.textContent = node.dataset.tipTitle || titleNode.textContent;
          tooltipFullName.textContent = node.dataset.tipFull || &quot;&quot;;
          tooltipFullName.hidden = !node.dataset.tipFull;
          tooltipBody.textContent = node.dataset.tipBody || &quot;&quot;;
          tooltip.classList.add(&quot;is-visible&quot;);
          tooltip.setAttribute(&quot;aria-hidden&quot;, &quot;false&quot;);
          moveTooltip(event);
        });
        titleNode.addEventListener(&quot;mousemove&quot;, moveTooltip);
        titleNode.addEventListener(&quot;mouseleave&quot;, () =&gt; {
          tooltip.classList.remove(&quot;is-visible&quot;);
          tooltip.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
        });
      });

      const focusDialog = root.querySelector(&quot;#rq-focus&quot;);
      const focusClose = root.querySelector(&quot;#rq-focus-close&quot;);
      let resumeAfterFocus = false;
      let focusSource = null;
      root.querySelectorAll(&quot;.node, .question-panel&quot;).forEach((node) =&gt; {
        const isQuestions = node.classList.contains(&quot;question-panel&quot;);
        node.setAttribute(&quot;role&quot;, &quot;button&quot;);
        node.setAttribute(&quot;tabindex&quot;, &quot;0&quot;);
        node.setAttribute(&quot;aria-haspopup&quot;, &quot;dialog&quot;);
        node.setAttribute(&quot;aria-label&quot;, `Enlarge ${isQuestions ? &quot;Full research questions&quot; : node.dataset.tipTitle}`);
        function openFocus() {
          if (focusDialog.open) return;
          focusSource = node;
          resumeAfterFocus = running;
          running = false;
          toggle.textContent = &quot;Run&quot;;
          tooltip.classList.remove(&quot;is-visible&quot;);
          tooltip.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
          focusDialog.classList.toggle(&quot;questions-focus&quot;, isQuestions);
          root.querySelector(&quot;#rq-focus-title&quot;).textContent = isQuestions ? &quot;Full research questions&quot; : node.querySelector(&quot;.title&quot;).textContent;
          const full = root.querySelector(&quot;#rq-focus-full&quot;);
          full.textContent = node.dataset.tipFull || &quot;&quot;;
          full.hidden = !full.textContent;
          const list = root.querySelector(&quot;#rq-focus-lines&quot;);
          list.replaceChildren();
          node.querySelectorAll(isQuestions ? &quot;.question-text&quot; : &quot;.sub&quot;).forEach((text) =&gt; {
            const item = document.createElement(&quot;li&quot;);
            const spans = Array.from(text.querySelectorAll(&quot;tspan&quot;));
            const content = spans.length ? spans.map((span) =&gt; span.textContent).join(&quot; &quot;).replace(/-\s+/g, &quot;-&quot;) : text.textContent;
            if (isQuestions) {
              const heading = document.createElement(&quot;strong&quot;);
              heading.textContent = text.previousElementSibling.textContent;
              item.append(heading, document.createTextNode(content));
            } else {
              item.textContent = content;
            }
            list.append(item);
          });
          root.querySelector(&quot;#rq-focus-description&quot;).textContent = node.dataset.tipBody || &quot;&quot;;
          root.querySelector(&quot;#rq-focus-description&quot;).hidden = !node.dataset.tipBody;
          focusDialog.style.setProperty(&quot;--focus-color&quot;, getComputedStyle(node.querySelector(&quot;rect, polygon&quot;)).stroke);
          focusDialog.showModal();
          focusClose.focus();
        }
        node.addEventListener(&quot;click&quot;, openFocus);
        node.addEventListener(&quot;keydown&quot;, (event) =&gt; {
          if (event.key === &quot;Enter&quot; || event.key === &quot; &quot;) {
            event.preventDefault();
            openFocus();
          }
        });
      });
      focusDialog.addEventListener(&quot;cancel&quot;, (event) =&gt; event.preventDefault());
      focusClose.addEventListener(&quot;click&quot;, () =&gt; focusDialog.close());
      focusDialog.addEventListener(&quot;close&quot;, () =&gt; {
        running = resumeAfterFocus;
        last = performance.now();
        toggle.textContent = running ? &quot;Pause&quot; : &quot;Run&quot;;
        if (focusSource) focusSource.focus();
      });

      toggle.addEventListener(&quot;click&quot;, () =&gt; {
        running = !running;
        toggle.textContent = running ? &quot;Pause&quot; : &quot;Run&quot;;
      });
      speedInput.addEventListener(&quot;input&quot;, () =&gt; {
        speed = Number(speedInput.value);
      });
      scenarioInput.addEventListener(&quot;change&quot;, updateScenario);
      scenarioInput.addEventListener(&quot;input&quot;, updateScenario);

      updateScenario();
      requestAnimationFrame(animate);
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
