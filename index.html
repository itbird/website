<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Zhong Chen's academic landing page for AI, knowledge graphs, ontology, and food waste reduction research."
    />
    <title>Zhong Chen</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18212f;
        --muted: #5d6878;
        --line: #dce3ec;
        --paper: #f7f4ee;
        --accent: #0f766e;
        --accent-strong: #b93815;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 18%, rgba(15, 118, 110, 0.16), transparent 28rem),
          radial-gradient(circle at 80% 82%, rgba(185, 56, 21, 0.12), transparent 24rem),
          var(--paper);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
      }

      .page {
        width: min(100%, 920px);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 760px;
        font-size: clamp(3.5rem, 10vw, 8.5rem);
        line-height: 0.9;
        letter-spacing: 0;
      }

      .intro {
        max-width: 690px;
        margin: 28px 0 0;
        color: var(--muted);
        font-size: clamp(1.08rem, 2vw, 1.35rem);
        line-height: 1.65;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.45);
        font-weight: 700;
        text-decoration: none;
        transition:
          border-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      a:hover {
        border-color: var(--accent);
        color: var(--accent-strong);
        transform: translateY(-1px);
      }

      @media (max-width: 620px) {
        main {
          align-items: end;
          padding: 24px;
        }

        .links {
          flex-direction: column;
        }

        a {
          justify-content: center;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="page" aria-label="Academic landing page">
        <p class="eyebrow">PhD Candidate | RMIT University &amp; CSIRO</p>
        <h1>Hello, I'm Zhong Chen.</h1>
        <p class="intro">
          I work on AI, knowledge graphs, ontology, and food waste reduction.
          This page is a small beginning for my academic home on the web.
        </p>
        <nav class="links" aria-label="Profile links">
          <a href="mailto:zhong@zhongchen.ai">zhong@zhongchen.ai</a>
          <a href="https://scholar.google.com/" rel="noreferrer">Google Scholar</a>
          <a href="https://orcid.org/" rel="noreferrer">ORCID</a>
          <a href="https://github.com/" rel="noreferrer">GitHub</a>
        </nav>
      </section>
    </main>
  </body>
</html>
